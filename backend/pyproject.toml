[project]
name = "exec-sim-backend"
version = "0.1.0"
description = "Medicare Advantage AI Executive Simulation - API and simulation engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.48",
    "alembic>=1.16",
    "anthropic>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx>=0.28", "ruff>=0.16"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Typographic dashes/arrows are intentional in user-facing copy.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # E501: line length is owned by `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
