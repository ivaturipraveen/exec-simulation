  m3: {value: 59.0, headroom: 12.0, headroom_text: "+12 pts (mostly capture, not control)", root_cause_link: H-RC3}
  m4: {value: 70.0, headroom: 6.0, headroom_text: "+6 pts", root_cause_link: H-RC3}
  m5: {value: 62.0, headroom: 10.0, headroom_text: "+10 pts", root_cause_link: H-RC2}
  m7: {value: 9.0, headroom: 1.0, headroom_text: "-1.0", root_cause_link: "none; younger population"}
  m9: {value: 80.0, headroom: 2.0, headroom_text: "+2 pts", root_cause_link: none}
