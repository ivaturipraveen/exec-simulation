# Investment catalog — Content Pack v0.1 section 4 (18 cards). No card has a fixed effect:
# realized effect = base × payer fit × rule multipliers × adoption × capacity × diminishing
# returns × lag share (section 5). Effects are in raw measure units, signed as reported
# (M7 and M11 improve when they go DOWN). Rules use the condition vocabulary in models.py.

- id: i1
  code: I1
  name: Member 360 and identity resolution
  capability_class: data_foundation
  class_label: Data foundation
  summary: Resolve member identity across pharmacy, medical and CRM data into one governed record, including prior-plan history.
  cost_musd: 5.0
  cost_text: "$5.0M full scope; $2.5M scoped to one book or region"
  scopes:
    - {id: full, label: Full scope, cost_musd: 5.0, factor: 1.0}
    - {id: scoped, label: Scoped to one book or region, cost_musd: 2.5, factor: 0.5}
  duration_quarters: 3
  capacity_points: 4
  opex_musd_per_year: 0.4
  opex_text: $0.4M per year stewardship
  prerequisites_text: None. Executive data owner named.
  effect_text: No direct measure effect. Multiplies I3, I7, I8 by 1.4 and removes the identity penalty (0.6) on outreach-based investments.
  decay_text: None if stewardship funded; identity drifts 2% per year otherwise
  synergies: [i2, i3, i7, i8]
  conflicts: [i2]
  conflicts_text: Competes with I2 for the same data engineers (capacity)
  reversible_text: Yes, but sunk cost
  reversibility: 0.5
  payer_fit:
    horizon: {level: medium, note: "Few systems, but prior-plan history stitching is the real need"}
    heritage: {level: high, note: "The binding constraint for Lakeshore and Pinecrest"}
    communitycare: {level: low, note: "Identity is already clean on the shared EHR"}
  kpi_effects:
    - {kpi: identity_match, set_to: 97}
  owner_required: true
  owner_missing_multiplier: 0.5
  owner_prompt: Executive data owner
  risk: {tags: [privacy, delivery], text: "Scope creep; match-rule errors create new duplicates; source-system owners resist"}
  is_foundation: true

- id: i2
  code: I2
  name: Data modernization and integration
  capability_class: data_foundation
  class_label: Data foundation
  summary: Modern integration layer and near-real-time feeds that cut data latency for every later initiative.
  cost_musd: 6.0
  cost_text: $6.0M
  duration_quarters: 4
  capacity_points: 5
  opex_musd_per_year: 0.8
  opex_text: $0.8M per year platform
  prerequisites_text: None. Realistically needs I1 to deliver value.
  effect_text: No direct measure effect. Reduces data latency; multiplies I5, I6, I8 by 1.3 from the quarter after completion. Lab feed coverage +30 pts (M4 leading KPI).
  decay_text: None
  synergies: [i1, i5, i6, i8, i13]
  conflicts: [i1]
  conflicts_text: I1 (capacity); Heritage claims platform migration
  reversible_text: "No"
  reversibility: 0.0
  payer_fit:
    horizon: {level: low, note: "Stack is already modern; this is money spent twice"}
    heritage: {level: high, note: "But four quarters is longer than the board will wait"}
    communitycare: {level: medium, note: "Payer-side data is weak, but system IT controls the EHR side"}
  kpi_effects:
    - {kpi: lab_feed_coverage, delta: 30}
  savings_musd_per_year: {horizon: 0.0, heritage: 1.0, communitycare: 0.3}
  risk: {tags: [delivery, privacy], text: "Time to value; scope creep; competes with core platform migrations"}
  is_foundation: true

- id: i3
  code: I3
  name: Predictive adherence intelligence
  capability_class: predictive
  class_label: Predictive AI
  summary: Model that ranks members by risk of non-adherence so outreach reaches the right members before refills lapse.
  cost_musd: 1.75
  cost_text: $1.75M
  duration_quarters: 2
  capacity_points: 2
  opex_musd_per_year: 0.2
  opex_text: $0.2M per year
  prerequisites_text: 12 months of pharmacy history for the target population; I12 recommended
  effect_text: M1 +2.5 pts, M2 +2.0 pts at full execution, only when outreach capacity (I14 or I8) exists. Without capacity, +0.5 pts.
  decay_text: "Model drift: effect falls 25% per year without I12"
  synergies: [i1, i12, i14, i8]
  reversible_text: "Yes"
  reversibility: 0.8
  channel: phone
  payer_fit:
    horizon: {level: low, note: "40% of members lack history; mis-targets without I1"}
    heritage: {level: medium, note: "Right members are already known; capacity is the limit"}
    communitycare: {level: medium, note: "Good data, transport barriers limit response"}
  effects:
    - {measure: m1, base: 2.5}
    - {measure: m2, base: 2.0}
  rules:
    - {when: {none_live: [i14, i8]}, multiplier: 0.2, label: "No outreach capacity (I14 or I8): +0.5 pts only"}
    - {when: {any_live: [i14]}, multiplier: 2.0, label: "Pharmacy outreach capacity (I14) doubles the realized effect"}
    - {when: {any_live: [i1]}, multiplier: 1.4, label: "Member 360 (I1) live"}
    - {when: {none_live: [i1], kpi_below: {identity_match: 95}}, multiplier: 0.6, label: "Identity penalty: match rate under 95% without I1"}
  decay: {rate_per_year: 0.25, unless: {any_live: [i12]}, label: "Model drift without validation and monitoring (I12)"}
  risk: {tags: [bias], text: "Bias against members with thin history; drift; targets the wrong members on bad identity data"}

