viable_strategies:
  - title: Adoption-first
    description: >-
      Provider incentives (I15), workflow redesign (I11), provider copilot embedded in the EHR (I6)
      and access expansion (I16). Slower to show in leading KPIs, large Year 2 effect on access and
      screening.
    round1: [i15, i11, i6, i16]
    round2: [i10]
  - title: Capacity-first
    description: >-
      Access expansion (I16), pharmacy capacity (I14), personalized engagement tuned to transport
      barriers (I7), governance (I10). Lifts appointments and adherence without depending on
      system IT.
    round1: [i16, i14, i7, i10, i18, i12]
failure_modes:
  - title: Insight-heavy
    description: "Insight-heavy portfolio (I5, I6, I3) without I11 or I15: the ignored-recommendations crisis fires, adoption stays under 10%, measures flat."
  - title: Outreach-heavy
    description: "Outreach-heavy portfolio (I7, I8) without I16: appointment demand rises, access measure falls a star, complaints rise."
conflict_hooks:
  - roles: [Plan CEO, System CMIO]
    tension: Put plan recommendations in the EHR inbox vs. protect clinicians from more alerts.
  - roles: [CFO, Chief Medical Officer]
    tension: Spend on incentives and access vs. on analytics the system can showcase.
  - roles: [Chief Quality Officer, Clinic Operations Director]
    tension: More outreach for screening vs. clinics that cannot absorb the demand.
