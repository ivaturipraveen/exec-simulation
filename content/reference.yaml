  readiness_dimensions: [data, workflow, owner, controls]
  foundational_themes: [Data integration, Governance, Knowledge architecture, Adoption capability]
  act_now_value: 4
  act_now_readiness: 4
  foundational_min_links: 3
  retention_months: 12
  consent_text: >-
    I consent to this opportunity being stored for 12 months and shared with my organization's
    aggregate AI Opportunity Map. Named owners appear only on my organization's own map; I can ask
    for deletion at any time.

