data_readiness: 3
dual_share: 0.14
flags: [shared_contact_data, thin_history]
profile:
  - {label: Members, value: "52,400 (grew from 19,000 in 30 months)"}
  - {label: Geography, value: "17 counties across Arizona, Texas and Florida; 9 counties entered in the last 18 months"}
  - {label: Product mix, value: "88% MA-PD HMO, 12% PPO; one D-SNP launched this year (3,100 members)"}
  - {label: Dual-eligible / LIS share, value: "14% dual, 21% LIS"}
  - {label: Average member age, value: "71.2 (younger than market)"}
  - {label: Starting overall rating, value: "3.0 Stars (simulated)"}
  - {label: Revenue, value: "$690M illustrative"}
  - {label: Round 1 capital, value: "$18.0M"}
  - {label: Round 2 capital, value: "$8.0M base plus up to $4.0M earned at the board pitch"}
  - {label: Implementation capacity, value: "10 capacity points per quarter"}
  - {label: Data readiness score, value: "3 of 5 (modern stack, 40% of members have under 12 months of history)"}
