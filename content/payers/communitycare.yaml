  m2: {value: 87.0, headroom: 3.5, headroom_text: "+3.5 pts", root_cause_link: C-RC2}
  m3: {value: 73.0, headroom: 4.0, headroom_text: "+4 pts", root_cause_link: C-RC1}
  m4: {value: 78.0, headroom: 3.0, headroom_text: "+3 pts", root_cause_link: C-RC1}
  m5: {value: 75.0, headroom: 5.0, headroom_text: "+5 pts (only if imaging capacity is added)", root_cause_link: C-RC2}
  m7: {value: 10.5, headroom: 1.5, headroom_text: "-1.5", root_cause_link: "C-RC3 (care managers report to clinics)"}
  m9: {value: 72.0, headroom: 6.0, headroom_text: "+6 pts (only with access expansion)", root_cause_link: C-RC2}
  m10: {value: 91.0, headroom: 1.5, headroom_text: "+1.5 pts", root_cause_link: none}
  m11: {value: 0.20, headroom: 0.05, headroom_text: "-0.05", root_cause_link: "C-RC2 (if outreach outpaces access)"}
  m12: {value: 88.0, headroom: 4.0, headroom_text: "+4 pts", root_cause_link: none}
