population: >-
  Younger, faster-growing membership with incomplete longitudinal history. Digital engagement
  rates look strong but are concentrated among healthy members in legacy counties. New-county
  members skew older, more rural and less reachable by app or SMS.
board_mandate: >-
  Reach 4.0 Stars within two rating cycles to support the next funding round, without slowing
  county expansion. The board is comfortable with speed and uncomfortable with anything that
  looks like a two-year foundation program.
briefing: >-
  Horizon Health is a private-equity-backed Medicare Advantage plan that has grown from 19,000
  to 52,400 members in 30 months by entering nine new counties across Arizona, Texas and
  Florida. It runs a two-year-old cloud data platform, a single CRM and a modern core admin
  system, and its leadership team has a strong appetite for AI. The plan sits at 3.0 Stars.
  Blood pressure control, breast screening and complaints are at 2 Stars, and the six-person
  quality operations team has never run a full Stars cycle. You have $18.0M of Round 1 capital
  and 10 capacity points a quarter. The board wants 4.0 Stars within two rating cycles to
  support the next funding round.
advantages:
  - Modern cloud data platform; integrations take weeks, not quarters
  - Capital is available and the board decides quickly
  - Leadership appetite for AI is high; no legacy vendor contracts to unwind
  - Low readmission baseline because the population is younger
constraints:
  - 40% of members lack 12 months of claims and pharmacy history, so risk models and gap lists are unstable
  - No quality incentives in new-county provider contracts; alerts to those providers are ignored
  - Quality operations team is six people and has never run a full Stars cycle
  - Complaint rate is already at 2 Stars and rising with growth
hidden_root_causes:
  - id: H-RC1
    title: History gap mis-targets everything
    description: >-
      Members enrolled under 12 months are excluded from or mis-scored in adherence and gap
      models. Outreach lists over-represent legacy-county members who are already adherent and
      miss the new-county members driving the shortfall. Any predictive investment inherits
      this unless identity and history stitching from prior-plan data is funded first.
    affected_measures: [m1, m2]
    clue: >-
      Adherence outreach keeps reaching members who were already above 80% PDC; members enrolled
      in the last 12 months barely appear on the lists.
    addressed_by: [i1]
  - id: H-RC2
    title: Digital-first engagement mis-segments
    description: >-
      The engagement platform defaults to app and SMS. 61% of new-county members over 75 have
      never opened the app. Outreach reports show high 'reach' because the message was sent, not
      because anyone read it. Complaints are rising from members who receive messages intended
      for other households (shared phone numbers, address churn).
    affected_measures: [m5, m11]
    clue: >-
      Outreach "reach" counts messages sent, not read, and a third of complaints are coded
      "outreach received in error" or "wrong household".
    addressed_by: [i1, i10]
  - id: H-RC3
    title: Providers in new counties have no reason to act
    description: >-
      New-county contracts are fee-for-service with no quality incentive. Gap alerts go to a
      portal with 9% open rate. Blood pressure control sits at 2 Stars mainly because readings
      are not captured, not because members are uncontrolled.
    affected_measures: [m3, m4]
    clue: >-
      New-county practices open 9% of gap alerts and act on 3%; chart review suggests most
      hypertensive members are controlled but readings never reach the plan.
    addressed_by: [i15]
misleading_signals:
  - id: H-MS1
    title: App engagement looks excellent
    why_misleading: >-
      A 44% monthly active rate is real but comes from healthy legacy-county members. Teams that
      invest in more digital engagement will see leading KPIs rise and measures barely move.
  - id: H-MS2
    title: Call volume per member is low
    why_misleading: >-
      Low volume reads as low demand. It is actually 11% abandonment and a vendor IVR that drops
      calls after 4 minutes. Complaints and CAHPS customer service are the downstream cost.
trap_title: Automate everything
trap_description: >-
  Speed outpaces validation, governance and organizational readiness. The signature failure is a
  personalized engagement agent launched on bad identity data that sends inappropriate outreach to
  thousands of members.
