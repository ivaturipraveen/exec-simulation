  cost_musd: 2.0
  cost_text: $2.0M
  duration_quarters: 2
  capacity_points: 2
  opex_musd_per_year: 0.35
  opex_text: $0.35M per year
  prerequisites_text: Knowledge base current (I17 or 1 quarter of cleanup); human review of generated responses
  effect_text: M10 +2.5 pts; M11 -0.10; first-contact resolution +12 pts; handle time -15%. Halved without I17 or knowledge cleanup.
  decay_text: Effect falls 30% per year if knowledge base is not maintained
  synergies: [i17, i10]
  reversible_text: "Yes"
  reversibility: 0.8
  channel: phone
  payer_fit:
    horizon: {level: medium, note: "Two vendors, two knowledge bases; abandonment is the IVR, not the agents"}
    heritage: {level: high, note: "540 agents, legacy knowledge, biggest leverage"}
    communitycare: {level: low, note: "Service is already 4 Stars"}
  effects:
    - {measure: m10, base: 2.5}
    - {measure: m11, base: -0.10}
  kpi_effects:
    - {kpi: fcr, delta: 12}
  rules:
    - {when: {any_live: [i17]}, multiplier: 2.0, label: "Knowledge base and IVR modernized (I17): ×2.0 (section 5 dependency multiplier)"}
  adoption: {baseline: 0.30}
  decay: {rate_per_year: 0.30, unless: {any_live: [i17]}, label: "Knowledge base not maintained"}
  savings_musd_per_year: {horizon: 0.4, heritage: 2.5, communitycare: 0.3}
  risk: {tags: [member_harm, reputation], text: "Wrong answers to members on benefits; agent over-reliance; needs oversight sampling"}

