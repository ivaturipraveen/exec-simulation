# Content Pack §12 — review checklist for Girish, in the order the items unblock the build.
# Sign-off status is recorded in Settings → Content review.
review_checklist:
  - {id: RC-1, section: "§1", item: "Assumptions log: confirm or change each of the 18 rows, especially OD-01 duration, OD-02 capital mechanic and OD-07 AI boundaries."}
  - {id: RC-2, section: "§3", item: "Measure list: confirm the ten measures, the weight classes and the measure names against the current CMS Technical Notes. Decide whether colorectal screening or ED follow-up replaces any of them."}
  - {id: RC-3, section: "§3", item: "Game thresholds and starting values: adjust so that each payer sits where you want it narratively. The engine does not care about the absolute numbers, only the distance to the next star."}
  - {id: RC-4, section: "§2", item: "Payer bibles: check that the root causes ring true to a payer executive and that no archetype is obviously superior."}
  - {id: RC-5, section: "§4–5", item: "Investment effects and payer multipliers: sanity-check magnitudes against your experience. The reference portfolios in 5.2 show what the numbers produce (see docs/calibration.md)."}
  - {id: RC-6, section: "§7", item: "Crisis packets: adjust tone and realism; add any event you have seen in practice that is missing."}
  - {id: RC-7, section: "§9", item: "Run-of-show: rehearse the transition scripts; cut what does not sound like you."}
  - {id: RC-8, section: "CMS-005", item: "Name the independent Stars reviewer."}
  - {id: RC-9, section: "§6", item: "Approve the data room specifications (and the 90 generated artifacts) for realism."}
