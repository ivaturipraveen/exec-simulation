viable_strategies:
  - title: Foundation-light
    description: >-
      Fund identity resolution and prior-plan history stitching (I1), then predictive adherence
      (I3) and pharmacy capacity (I14) with governance (I10). Slower Year 1, strong Year 2.
    round1: [i1, i3, i14, i10, i17, i4, i12]
  - title: Provider-first
    description: >-
      Fund provider incentives (I15) and provider performance intelligence (I5) to unlock blood
      pressure and screening in new counties, with contact-center copilot (I4) to arrest
      complaints. Faster Year 1 on clinical measures.
    round1: [i15, i5, i4, i17, i10, i7, i12]
failure_modes:
  - title: Engagement-heavy
    description: "Engagement-heavy portfolio (I7 plus I8) without I1 or I10: triggers the eligibility crisis at high severity and complaints fall to 1 Star."
  - title: Modernization-heavy
    description: "Modernization-heavy portfolio (I2 plus I1) consumes all capacity and shows nothing by the board pitch; Round 2 capital is cut."
conflict_hooks:
  - roles: [CEO, Chief Compliance Officer]
    tension: Launch automation this quarter to show the board progress vs. validate first.
  - roles: [CFO, Chief Quality Officer]
    tension: Fund AI that cuts admin cost vs. fund provider incentives and quality capacity.
  - roles: [CTO, Provider Network Lead]
    tension: Build a provider copilot vs. invest in incentives and relationships practices value.
