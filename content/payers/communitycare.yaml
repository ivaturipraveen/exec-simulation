population: >-
  Geographically concentrated, well attributed, with rich clinical context from the shared EHR.
  Access is the binding constraint: primary care panels are full and third-next-available
  appointment is 24 days. Rural edges of the region have transport barriers.
board_mandate: >-
  Reach 4.0 Stars and prove the plan-provider model to the system board, which is weighing whether
  to keep the plan. Capital is modest and every dollar is compared against clinical investments the
  system could make instead.
briefing: >-
  CommunityCare Alliance is the 94,800-member Medicare Advantage plan of a health system in the
  four-county Cascade Valley region. Of its members, 82% are attributed to the sponsoring system,
  which shares its EHR with the plan, so lab, vitals and encounter data are current and complete.
  Blood pressure and glycemic control are already at 4 Stars and complaints are low. The plan sits
  at 3.5 Stars, with Getting Appointments at 2 Stars. You have $12.0M of Round 1 capital and only
  6 capacity points a quarter, because plan IT is small and system IT has its own queue. The system
  board is weighing whether to keep the plan at all.
advantages:
  - "Shared EHR: lab, vitals and encounter data are current and complete for 82% of members"
  - Trusted clinical relationships; care managers sit inside clinics
  - Low complaint rate and strong customer service scores
  - Blood pressure and glycemic control already at 4 Stars
constraints:
  - PCP panels are full; outreach generates demand the clinics cannot absorb
  - Employed clinicians are salaried with no quality compensation; plan quality is not on their scorecard
  - Clinical recommendations go to a plan portal; clinicians work in the EHR inbox
  - Plan IT depends on system IT for any EHR-facing change; queue is 2 quarters
hidden_root_causes:
  - id: C-RC1
    title: Recommendations land where nobody works
    description: >-
      The plan's gap and risk recommendations are delivered to a plan portal with a 6% clinician
      open rate. The sponsoring system's clinicians live in the EHR inbox. Until recommendations
      are delivered inside the EHR workflow with an agreed owner, insight quality is irrelevant.
    affected_measures: [m3, m4]
    clue: >-
      Recommendations are accurate, but almost none are opened; clinicians act quickly on what
      reaches their EHR inbox, and plan recommendations never get there.
    addressed_by: [i6, i11]
  - id: C-RC2
    title: Access, not awareness, caps screening and appointments
    description: >-
      Breast screening outreach already reaches 78% of eligible members. Third-next-available
      appointment is 24 days and imaging slots are booked 6 weeks out. Getting Appointments and
      Care Quickly sits at 2 Stars for the same reason. More outreach raises complaints, not
      screening.
    affected_measures: [m5, m9, m1, m2]
    clue: >-
      Outreach reaches most eligible members, but only about one in five gets scheduled;
      members wait more than three weeks for appointments and six weeks for imaging.
    addressed_by: [i16]
  - id: C-RC3
    title: Affiliation is assumed to mean alignment
    description: >-
      Plan and system leadership believe the shared ownership guarantees adoption. Clinicians
      receive no Stars-linked compensation and see plan requests as administrative burden. Care
      managers employed by the system report to clinic directors, not the plan.
    affected_measures: [m3, m4, m7]
    clue: >-
      Employed clinicians perform no better than independents on plan priorities, and most care
      managers report to clinic directors rather than the plan.
    addressed_by: [i15, i11]
misleading_signals:
  - id: C-MS1
    title: Clinical data completeness is best-in-class
    why_misleading: >-
      Predictive models validate beautifully on this data. Teams conclude that insight is the gap.
      It is not; action is.
  - id: C-MS2
    title: Customer Service CAHPS at 4 Stars
    why_misleading: >-
      Members like the people they reach. The problem is the appointment they cannot get, which
      shows up in a different CAHPS measure and in disenrollment.
trap_title: Assume affiliation guarantees adoption
trap_description: >-
  Value comes from coordinated action (workflow placement, incentives, capacity), not from data
  possession. The signature failure is a provider copilot that produces excellent recommendations
  which clinicians ignore.
measures:
