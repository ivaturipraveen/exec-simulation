flags: [shared_ehr]
profile:
  - {label: Members, value: "94,800"}
  - {label: Geography, value: "One metropolitan region (Cascade Valley, 4 counties); 82% of members attributed to the sponsoring health system"}
  - {label: Product mix, value: "74% HMO, 18% PPO, 8% D-SNP"}
  - {label: Dual-eligible / LIS share, value: "18% dual, 26% LIS"}
  - {label: Average member age, value: "73.9"}
  - {label: Starting overall rating, value: "3.5 Stars (simulated)"}
  - {label: Revenue, value: "$1.3B illustrative"}
  - {label: Round 1 capital, value: "$12.0M"}
  - {label: Round 2 capital, value: "$8.0M base plus up to $4.0M earned at the board pitch"}
  - {label: Implementation capacity, value: "6 capacity points per quarter (plan IT is small; system IT has its own priorities)"}
  - {label: Data readiness score, value: "3 of 5 (excellent clinical data from the system EHR, weak payer-side operations data)"}
  - {label: Care management staff, value: "48 care managers (28 employed by the health system), 5 pharmacists"}
  - {label: Contact center, value: "95 agents, abandonment 6%"}
  - {label: Technology, value: "Shared EHR with the sponsoring system; plan runs a separate core admin and a small warehouse; 6 source systems"}
